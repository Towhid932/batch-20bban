<!doctype html>

<html lang="bn">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="batch2020logo.png">
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@100..900&family=Noto+Sans:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <title>2020 Batch, BBan</title>

    <style>
      /* =====================================================
   GENERAL
   ===================================================== */

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;

        padding: 20px;

        background: #f1f5f9;

        color: #1e293b;

        font-family: "Noto Sans Bengali", "Noto Sans", sans-serif;
      }

      .container {
        width: 100%;

        max-width: 1200px;

        margin: auto;
      }

      /* =====================================================
   SEARCH BOX
   ===================================================== */

      .search-box {
        background: white;

        padding: 25px;

        border-radius: 12px;

        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }

      .title {
        text-align: center;

        margin-top: 0;

        margin-bottom: 20px;
      }

      /* =====================================================
   SEARCH ROW
   ===================================================== */

      .search-row {
        display: flex;

        gap: 10px;
      }

      #bpInput {
        flex: 1;

        height: 48px;

        padding: 0 14px;

        border: 1px solid #cbd5e1;

        border-radius: 7px;

        font-size: 17px;

        letter-spacing: 1px;
      }

      #bpInput:focus {
        outline: none;

        border-color: #2563eb;
      }

      /* =====================================================
   BUTTONS
   ===================================================== */

      button {
        height: 48px;

        padding: 0 25px;

        border: none;

        border-radius: 7px;

        color: white;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;
      }

      #searchBtn {
        background: #2563eb;
      }

      #searchBtn:hover {
        background: #1d4ed8;
      }

      #addBtn {
        background: #00C853;
      }
      #addBtn:hover {
        background: #28A745;
      }
      #addBtn a {
        text-decoration: none;
      }
      #printBtn {
        background: #475569;
      }

      #printBtn:hover {
        background: #334155;
      }

      button:disabled {
        background: #94a3b8 !important;

        cursor: not-allowed;
      }

      /* =====================================================
   MESSAGE
   ===================================================== */

      .message {
        display: none;

        margin-top: 15px;

        padding: 12px;

        border-radius: 7px;

        text-align: center;

        font-weight: bold;
      }

      .message.error {
        display: block;

        background: #fee2e2;

        color: #991b1b;

        border: 1px solid #fecaca;
      }

      .message.success {
        display: block;

        background: #dcfce7;

        color: #166534;

        border: 1px solid #bbf7d0;
      }

      /* =====================================================
   TOTAL AMOUNT
   ===================================================== */

      .total-box {
        display: none;

        margin-top: 15px;

        padding: 18px;

        background: #0f766e;

        color: white;

        border-radius: 12px;

        text-align: center;
      }

      .total-title {
        font-size: 16px;
      }

      .total-amount {
        margin-top: 5px;

        font-size: 32px;

        font-weight: bold;
      }

      /* =====================================================
   PRINT DATE TIME
   ===================================================== */

      .print-date-time {
        display: none;

        margin-top: 10px;

        text-align: right;

        font-size: 14px;

        color: #334155;
      }

      /* =====================================================
   RESULT TABLE
   ===================================================== */

      .result-box {
        display: none;

        margin-top: 20px;

        background: white;

        padding: 15px;

        border-radius: 12px;

        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);

        overflow-x: auto;
      }

      table {
        width: 100%;

        border-collapse: collapse;
      }

      th {
        background: #1e293b;

        color: white;

        padding: 11px;

        white-space: nowrap;
      }

      td {
        padding: 10px;

        border-bottom: 1px solid #e2e8f0;

        white-space: nowrap;
      }

      tr:hover {
        background: #f8fafc;
      }

      .amount {
        text-align: right;

        font-weight: bold;
      }

      /* =====================================================
   MOBILE
   ===================================================== */

      @media (max-width: 700px) {
        body {
          padding: 10px;
        }

        .search-box {
          padding: 18px;
        }

        .search-row {
          flex-direction: column;
        }

        #searchBtn,
        #printBtn {
          width: 100%;
        }
      }

      /* =====================================================
   PRINT
   ===================================================== */

      @media print {
        @page {
          size: A4 landscape;

          margin: 10mm;
        }

        body {
          background: white;

          padding: 0;

          margin: 0;
        }

        .container {
          width: 100%;

          max-width: 100%;
        }

        .search-box {
          box-shadow: none;

          border: 1px solid #000;

          border-radius: 0;
        }

        /* Search ও Print button প্রিন্ট হবে না */

        #searchBtn,
        #printBtn {
          display: none !important;
        }

        /* Error/Success message প্রিন্ট হবে না */

        .message {
          display: none !important;
        }

        /* Print Date Time */

        .print-date-time {
          display: block !important;

          text-align: right;

          margin-top: 10px;

          font-size: 12px;

          color: #000;
        }

        /* Total Amount */

        .total-box {
          display: block !important;

          background: white !important;

          color: black !important;

          border: 2px solid #000;

          box-shadow: none;
        }

        /* Result */

        .result-box {
          display: block !important;

          box-shadow: none;

          border: 1px solid #000;

          border-radius: 0;

          overflow: visible;
        }

        table {
          width: 100%;

          font-size: 9px;
        }

        th {
          background: #e5e7eb !important;

          color: black !important;

          border: 1px solid #000;
        }

        td {
          border: 1px solid #000;
        }

        tr {
          page-break-inside: avoid;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- =================================================
       SEARCH BOX
       ================================================= -->

      <div class="search-box">
        <h2 class="title">
          বান্দরবান পার্বত্য জেলায় ২০২০ ব্যাচের কল্যাণ ফান্ডে আপনার ব্যাচমেটের
          সাহায্যের জন্য আপনার প্রদানকৃত হিসাব দেখুন
        </h2>
        <a href="serch.html"></a>

        <div class="search-row">
          <input type="text" id="bpInput" placeholder="BP লিখুন BP1234567890" maxlength="12" autocomplete="off" spellcheck="false"/>

          <button type="button" id="searchBtn">Search</button>

          <button type="button" id="printBtn" disabled>🖨️ Print</button>
          <button type="button" id="addBtn"><a href="add.html">➕ Entry</a></button>
        </div>

        <!-- MESSAGE -->

        <div id="message" class="message"></div>

        <!-- TOTAL -->

        <div id="totalBox" class="total-box">
          <div class="total-title">মোট Amount</div>

          <div id="totalAmount" class="total-amount">0.00</div>
        </div>

        <!-- PRINT DATE TIME -->

        <div id="printDateTime" class="print-date-time"></div>
      </div>

      <!-- =================================================
       RESULT
       ================================================= -->

      <div id="resultBox" class="result-box">
        <table>
          <thead>
            <tr>
              <th>SL</th>

              <th>BP</th>

              <th>Rank</th>

              <th>Brash</th>

              <th>Name</th>

              <th>Unit</th>

              <th>Date</th>

              <th>Jonno</th>

              <th>Amount</th>

              <th>Method</th>

              <th>Mobile</th>

              <th>Remark</th>
            </tr>
          </thead>

          <tbody id="resultBody"></tbody>
        </table>
      </div>
    </div>

    <script>
      // =====================================================
      // APPS SCRIPT WEB APP URL
      // =====================================================
      //
      // এখানে আপনার Apps Script Web App URL বসান
      //
      // =====================================================

      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbw48vnkEhT4D4aOHZVJ8Z9C4ZanFU6bpGbrVmiyXKmpLfHXfo-dnEYalh5LbahhJQJi/exec";

      // =====================================================
      // ELEMENTS
      // =====================================================

      const bpInput = document.getElementById("bpInput");

      const searchBtn = document.getElementById("searchBtn");

      const printBtn = document.getElementById("printBtn");

      const message = document.getElementById("message");

      const totalBox = document.getElementById("totalBox");

      const totalAmount = document.getElementById("totalAmount");

      const resultBox = document.getElementById("resultBox");

      const resultBody = document.getElementById("resultBody");

      const printDateTime = document.getElementById("printDateTime");

      // =====================================================
      // MESSAGE
      // =====================================================

      function showMessage(text, type) {
        message.textContent = text;

        message.className = "message " + type;
      }

      function clearMessage() {
        message.textContent = "";

        message.className = "message";
      }

      // =====================================================
      // CLEAR RESULT
      // =====================================================

      function clearResult() {
        resultBody.innerHTML = "";

        resultBox.style.display = "none";

        totalBox.style.display = "none";

        totalAmount.textContent = "0.00";

        printDateTime.textContent = "";

        printBtn.disabled = true;
      }

      // =====================================================
      // BP FORMAT
      // =====================================================

      function validateBP(bp) {
        return /^BP\d{10}$/.test(bp);
      }

      // =====================================================
      // LIVE VALIDATION
      //
      // লিখার সাথে সাথে Error
      // =====================================================

      bpInput.addEventListener("input", function () {
        const value = this.value;

        clearMessage();

        clearResult();

        // ---------------------------------------------
        // Empty
        // ---------------------------------------------

        if (value.length === 0) {
          return;
        }

        // ---------------------------------------------
        // প্রথম character B
        // ---------------------------------------------

        if (value.charAt(0) !== "B") {
          showMessage("Error: শুরুতে অবশ্যই বড় হাতের B দিতে হবে।", "error");

          return;
        }

        // ---------------------------------------------
        // দ্বিতীয় character P
        // ---------------------------------------------

        if (value.length >= 2 && value.substring(0, 2) !== "BP") {
          showMessage("Error: শুরুতে অবশ্যই বড় হাতের BP দিতে হবে।", "error");

          return;
        }

        // ---------------------------------------------
        // BP-এর পরে শুধু সংখ্যা
        // ---------------------------------------------

        if (value.length > 2 && !/^BP\d*$/.test(value)) {
          showMessage(
            "Error: BP-এর পরে শুধু সংখ্যা দিতে হবে। কোনো Space বা চিহ্ন দেওয়া যাবে না।",
            "error",
          );

          return;
        }

        // ---------------------------------------------
        // 12-এর বেশি
        // ---------------------------------------------

        if (value.length > 12) {
          showMessage("Error: BP অবশ্যই ১২টি character হতে হবে।", "error");

          return;
        }

        // ---------------------------------------------
        // সম্পূর্ণ BP সঠিক
        // ---------------------------------------------

        if (value.length === 12 && validateBP(value)) {
          showMessage("BP সঠিক হয়েছে। এখন Search করুন।", "success");
        }
      });

      // =====================================================
      // SEARCH
      // =====================================================

      async function searchBP() {
        clearMessage();

        clearResult();

        const bp = bpInput.value;

        // ===============================================
        // 1. খালি
        // ===============================================

        if (bp === "") {
          showMessage("Error: BP লিখুন।", "error");

          bpInput.focus();

          return;
        }

        // ===============================================
        // 2. শুরুতে BP নেই
        // ===============================================

        if (!bp.startsWith("BP")) {
          showMessage(
            "Error: BP অবশ্যই শুরুতে বড় হাতের BP দিয়ে শুরু হতে হবে।",
            "error",
          );

          bpInput.focus();

          return;
        }

        // ===============================================
        // 3. ছোট হাতের bp
        // ===============================================

        if (bp.startsWith("bp") || bp.startsWith("Bp") || bp.startsWith("bP")) {
          showMessage("Error: শুরুতে অবশ্যই বড় হাতের BP দিতে হবে।", "error");

          bpInput.focus();

          return;
        }

        // ===============================================
        // 4. Length
        // ===============================================

        if (bp.length !== 12) {
          showMessage("Error: BP অবশ্যই ১২টি character হতে হবে।", "error");

          bpInput.focus();

          return;
        }

        // ===============================================
        // 5. Format
        // ===============================================

        if (!validateBP(bp)) {
          showMessage(
            "Error: BP-এর পরে অবশ্যই ১০টি সংখ্যা দিতে হবে। কোনো Space বা চিহ্ন দেওয়া যাবে না।",
            "error",
          );

          bpInput.focus();

          return;
        }

        // ===============================================
        // SEARCHING
        // ===============================================

        searchBtn.disabled = true;

        printBtn.disabled = true;

        searchBtn.textContent = "Searching...";

        try {
          // ---------------------------------------------
          // URL
          // ---------------------------------------------

          const url = SCRIPT_URL + "?bp=" + encodeURIComponent(bp);

          // ---------------------------------------------
          // Request
          // ---------------------------------------------

          const response = await fetch(url, {
            method: "GET",
          });

          if (!response.ok) {
            throw new Error("Server response error");
          }

          // ---------------------------------------------
          // JSON
          // ---------------------------------------------

          const data = await response.json();

          // ---------------------------------------------
          // Server Error
          // ---------------------------------------------

          if (!data.success) {
            showMessage(data.message || "কোনো তথ্য পাওয়া যায়নি।", "error");

            return;
          }

          // ---------------------------------------------
          // Success
          // ---------------------------------------------

          showMessage(
            "তথ্য পাওয়া গেছে। মোট " + data.count + "টি এন্ট্রি।",
            "success",
          );

          // ---------------------------------------------
          // Total Amount
          // ---------------------------------------------

          totalAmount.textContent = Number(
            data.totalAmount || 0,
          ).toLocaleString("en-US", {
            minimumFractionDigits: 2,

            maximumFractionDigits: 2,
          });

          totalBox.style.display = "block";

          // ---------------------------------------------
          // Table
          // ---------------------------------------------

          data.results.forEach(function (item, index) {
            const tr = document.createElement("tr");

            // SL

            createCell(tr, index + 1);

            // BP

            createCell(tr, item.BP);

            // Rank

            createCell(tr, item.Rank);

            // Brush

            createCell(tr, item.Brush);

            // Name

            createCell(tr, item.Name);

            // Unit

            createCell(tr, item.Unit);

            // Date

            createCell(tr, item.Date);

            // Jonno

            createCell(tr, item.Jonno);

            // Amount

            const amountCell = createCell(
              tr,

              Number(item.Amount || 0).toLocaleString("en-US", {
                minimumFractionDigits: 2,

                maximumFractionDigits: 2,
              }),
            );

            amountCell.className = "amount";

            // Method

            createCell(tr, item.Method);

            // Mobile

            createCell(tr, item.Mobile);

            // Remark

            createCell(tr, item.Remark);

            resultBody.appendChild(tr);
          });

          // ---------------------------------------------
          // Show Result
          // ---------------------------------------------

          resultBox.style.display = "block";

          // ---------------------------------------------
          // Enable Print
          // ---------------------------------------------

          printBtn.disabled = false;
        } catch (error) {
          console.error(error);

          showMessage(
            "Google Sheet-এর সাথে যোগাযোগ করা যাচ্ছে না। Apps Script Web App URL ও Deployment পরীক্ষা করুন।",
            "error",
          );
        } finally {
          searchBtn.disabled = false;

          searchBtn.textContent = "Search";
        }
      }

      // =====================================================
      // CREATE TABLE CELL
      // =====================================================

      function createCell(row, value) {
        const td = document.createElement("td");

        td.textContent = value ?? "";

        row.appendChild(td);

        return td;
      }

      // =====================================================
      // PRINT DATE & TIME
      // =====================================================

      function getPrintDateTime() {
        const now = new Date();

        const day = String(now.getDate()).padStart(2, "0");

        const month = String(now.getMonth() + 1).padStart(2, "0");

        const year = now.getFullYear();

        let hours = now.getHours();

        const minutes = String(now.getMinutes()).padStart(2, "0");

        const seconds = String(now.getSeconds()).padStart(2, "0");

        const ampm = hours >= 12 ? "PM" : "AM";

        hours = hours % 12 || 12;

        hours = String(hours).padStart(2, "0");

        return (
          day +
          "-" +
          month +
          "-" +
          year +
          " " +
          hours +
          ":" +
          minutes +
          ":" +
          seconds +
          " " +
          ampm
        );
      }

      // =====================================================
      // PRINT
      // =====================================================

      function printPage() {
        if (resultBody.children.length === 0) {
          showMessage("Error: প্রথমে BP দিয়ে Search করুন।", "error");

          return;
        }

        // Print-এর ঠিক সময়ের Date & Time

        printDateTime.textContent =
          "প্রিন্টের তারিখ ও সময়: " + getPrintDateTime();

        window.print();
      }

      // =====================================================
      // SEARCH BUTTON
      // =====================================================

      searchBtn.addEventListener("click", searchBP);

      // =====================================================
      // PRINT BUTTON
      // =====================================================

      printBtn.addEventListener("click", printPage);

      // =====================================================
      // ENTER KEY
      // =====================================================

      bpInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          searchBP();
        }
      });
    </script>
  </body>
</html>
