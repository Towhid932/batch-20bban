<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="batch2020logo.png" />

    <link href="https://kriti.app/cdn/fcebcd9c.css" rel="stylesheet" />

    <title>2020 Batch Data Entry Form</title>

    <style>
      /* =====================================================
       GLOBAL
    ===================================================== */

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      :root {
        --blue: #2563eb;
        --blue-dark: #1d4ed8;
        --cyan: #0891b2;
        --green: #059669;

        --text: #334155;
        --muted: #64748b;

        --border: #cbd5e1;
      }

      /* =====================================================
       BODY
    ===================================================== */

      body {
        margin: 0;

        min-height: 100vh;

        padding: 30px 15px;

        font-family: Arial, sans-serif;

        color: var(--text);

        overflow-x: hidden;

        background:
          radial-gradient(
            circle at 5% 10%,
            rgba(37, 99, 235, 0.22),
            transparent 25%
          ),
          radial-gradient(
            circle at 95% 15%,
            rgba(16, 185, 129, 0.2),
            transparent 25%
          ),
          radial-gradient(
            circle at 50% 100%,
            rgba(139, 92, 246, 0.15),
            transparent 35%
          ),
          linear-gradient(135deg, #000001, #013468 50%, #9b2ba5);
      }

      /* =====================================================
       MAIN CONTAINER
    ===================================================== */

      .container {
        width: 100%;

        max-width: 780px;

        margin: auto;

        position: relative;

        overflow: hidden;

        border-radius: 26px;

        background:
          radial-gradient(
            circle at 0% 0%,
            rgba(59, 130, 246, 0.2),
            transparent 28%
          ),
          radial-gradient(
            circle at 100% 0%,
            rgba(6, 182, 212, 0.18),
            transparent 30%
          ),
          radial-gradient(
            circle at 100% 100%,
            rgba(16, 185, 129, 0.18),
            transparent 30%
          ),
          radial-gradient(
            circle at 0% 100%,
            rgba(139, 92, 246, 0.16),
            transparent 28%
          ),
          linear-gradient(
            135deg,
            #9c6a6a 0%,
            #114d92 30%,
            #2e5a5d 55%,
            #329e52 78%,
            #35238b 100%
          );

        border: 1px solid rgba(255, 255, 255, 0.9);

        box-shadow:
          0 30px 70px rgba(15, 23, 42, 0.15),
          0 10px 30px rgba(37, 99, 235, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);

        backdrop-filter: blur(18px);

        animation: containerFloat 6s ease-in-out infinite;
      }

      /* =====================================================
       CONTAINER DECORATION
    ===================================================== */

      .container::before {
        content: "";

        position: absolute;

        width: 320px;
        height: 320px;

        top: -190px;
        right: -120px;

        border-radius: 50%;

        background: linear-gradient(
          135deg,
          rgba(37, 99, 235, 0.12),
          rgba(6, 182, 212, 0.08)
        );

        border: 25px solid rgba(255, 255, 255, 0.2);

        filter: blur(1px);

        pointer-events: none;
      }

      .container::after {
        content: "";

        position: absolute;

        width: 280px;
        height: 280px;

        bottom: -170px;
        left: -110px;

        border-radius: 50%;

        background: linear-gradient(
          135deg,
          rgba(16, 185, 129, 0.12),
          rgba(139, 92, 246, 0.08)
        );

        border: 20px solid rgba(255, 255, 255, 0.18);

        pointer-events: none;
      }

      .container > * {
        position: relative;

        z-index: 2;
      }

      @keyframes containerFloat {
        0%,
        100% {
          box-shadow:
            0 30px 70px rgba(15, 23, 42, 0.15),
            0 10px 30px rgba(37, 99, 235, 0.1),
            inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        50% {
          box-shadow:
            0 35px 80px rgba(15, 23, 42, 0.18),
            0 15px 35px rgba(37, 99, 235, 0.14),
            inset 0 1px 0 rgba(255, 255, 255, 0.95);
        }
      }

      /* =====================================================
       HEADER
    ===================================================== */

      .header {
        position: relative;

        padding: 30px 25px;

        text-align: center;

        color: white;

        overflow: hidden;

        background:
          radial-gradient(
            circle at 15% 20%,
            rgba(255, 255, 255, 0.18),
            transparent 25%
          ),
          radial-gradient(
            circle at 85% 75%,
            rgba(16, 185, 129, 0.2),
            transparent 30%
          ),
          linear-gradient(135deg, #1d4ed8, #2563eb 45%, #0891b2 75%, #059669);
      }

      .header::before {
        content: "";

        position: absolute;

        width: 180px;
        height: 180px;

        top: -110px;
        right: -60px;

        border: 30px solid rgba(255, 255, 255, 0.08);

        border-radius: 50%;
      }

      .header::after {
        content: "";

        position: absolute;

        width: 130px;
        height: 130px;

        bottom: -90px;
        left: -45px;

        border: 20px solid rgba(255, 255, 255, 0.07);

        border-radius: 50%;
      }

      /* =====================================================
       LOGO
    ===================================================== */

      .logo-wrap {
        position: relative;

        z-index: 2;

        width: 90px;
        height: 90px;

        margin: 0 auto 14px;

        padding: 5px;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.18);

        border: 1px solid rgba(255, 255, 255, 0.35);

        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.16),
          inset 0 0 20px rgba(255, 255, 255, 0.12);

        animation: logoFloat 3s ease-in-out infinite;
      }

      .logo-wrap img {
        width: 100%;
        height: 100%;

        display: block;

        object-fit: contain;

        border-radius: 50%;

        background: white;

        padding: 7px;
      }

      @keyframes logoFloat {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-5px);
        }
      }

      .header h1 {
        position: relative;

        z-index: 2;

        margin: 0;

        font-family: "Nikosh", sans-serif;

        font-size: 21px;

        line-height: 1.5;

        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.15);
      }

      .header-subtitle {
        position: relative;

        z-index: 2;

        margin-top: 8px;

        color: rgba(255, 255, 255, 0.85);

        font-size: 11px;

        letter-spacing: 2px;
      }

      /* =====================================================
       SEARCH AREA
    ===================================================== */

      .search-box {
        padding: 16px 20px;

        text-align: center;

        font-family: "Nikosh", sans-serif;

        color: #475569;

        background: linear-gradient(
          90deg,
          rgba(240, 253, 244, 0.9),
          rgba(239, 246, 255, 0.9),
          rgba(236, 254, 255, 0.9)
        );

        border-bottom: 1px solid #e2e8f0;
      }

      .search-box a {
        display: inline-block;

        margin: 0 4px;

        padding: 5px 14px;

        color: white;

        text-decoration: none;

        font-weight: bold;

        border-radius: 20px;

        background: linear-gradient(135deg, #2563eb, #06b6d4);

        box-shadow: 0 5px 15px rgba(37, 99, 235, 0.2);

        transition: 0.25s ease;
      }

      .search-box a:hover {
        transform: translateY(-2px);

        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.28);
      }

      /* =====================================================
       FORM AREA
    ===================================================== */

      .form-area {
        position: relative;

        padding: 28px;

        overflow: hidden;

        background: linear-gradient(
          135deg,
          rgba(248, 251, 255, 0.78),
          rgba(239, 246, 255, 0.7),
          rgba(236, 253, 245, 0.76)
        );

        backdrop-filter: blur(8px);
      }

      .form-area::before {
        content: "";

        position: absolute;

        width: 280px;
        height: 280px;

        top: -150px;
        right: -100px;

        border-radius: 50%;

        background: linear-gradient(
          135deg,
          rgba(37, 99, 235, 0.12),
          rgba(6, 182, 212, 0.07)
        );

        filter: blur(8px);

        pointer-events: none;
      }

      .form-area::after {
        content: "";

        position: absolute;

        width: 250px;
        height: 250px;

        bottom: -140px;
        left: -100px;

        border-radius: 50%;

        background: linear-gradient(
          135deg,
          rgba(16, 185, 129, 0.12),
          rgba(139, 92, 246, 0.07)
        );

        filter: blur(8px);

        pointer-events: none;
      }

      /* =====================================================
       MESSAGE
    ===================================================== */

      .message {
        display: none;

        position: relative;

        z-index: 5;

        margin-bottom: 20px;

        padding: 13px 16px;

        border-radius: 12px;

        text-align: center;

        font-weight: bold;

        line-height: 1.6;
      }

      .success {
        display: block;

        color: #166534;

        background: #dcfce7;

        border: 1px solid #bbf7d0;
      }

      .error {
        display: block;

        color: #991b1b;

        background: #fee2e2;

        border: 1px solid #fecaca;
      }

      /* =====================================================
       TWO COLUMN FORM
    ===================================================== */

      .form-grid {
        position: relative;

        z-index: 2;

        display: grid;

        grid-template-columns: repeat(2, minmax(0, 1fr));

        column-gap: 18px;

        row-gap: 0;
      }

      .form-group {
        margin-bottom: 18px;

        min-width: 0;
      }

      .full-width {
        grid-column: 1 / -1;
      }

      /* =====================================================
       LABEL
    ===================================================== */

      label {
        display: block;

        margin-bottom: 7px;

        color: #334155;

        font-size: 14px;

        font-weight: 700;
      }

      label span {
        color: #ef4444;
      }

      /* =====================================================
       INPUT / SELECT / TEXTAREA
    ===================================================== */

      input,
      select,
      textarea {
        width: 100%;
        padding: 8px 13px;
        border: 1px solid #cbd5e1;
        border-radius: 11px;
        background: linear-gradient(
          135deg,
          #ffffff 0%,
          #f0f7ff 45%,
          #ecfeff 100%
        );
        color: #1e293b;
        font-family: "Nikosh", sans-serif;
        font-size: 15px;
        box-shadow:
          0 3px 8px rgba(37, 99, 235, 0.06),
          inset 0 1px 2px rgba(255, 255, 255, 0.8);
        transition: all 0.25s ease;
      }

      input::placeholder,
      textarea::placeholder {
        color: #94a3b8;
      }

      input:hover,
      select:hover,
      textarea:hover {
        border-color: #60a5fa;

        background: linear-gradient(135deg, #ffffff, #eaf4ff, #e6fffb);

        box-shadow: 0 5px 14px rgba(37, 99, 235, 0.1);
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;

        border-color: #2563eb;

        background: linear-gradient(
          135deg,
          #ffffff 0%,
          #e8f2ff 50%,
          #e6fffb 100%
        );

        box-shadow:
          0 0 0 4px rgba(37, 99, 235, 0.1),
          0 8px 20px rgba(37, 99, 235, 0.1);

        transform: translateY(-1px);
      }

      select {
        cursor: pointer;
      }

      textarea {
        min-height: 95px;

        resize: vertical;
      }

      /* =====================================================
       HIDDEN ID
    ===================================================== */

      #ID {
        display: none;
      }

      /* =====================================================
       FILE INPUT
    ===================================================== */

      input[type="file"] {
        padding: 7px;

        cursor: pointer;

        background: linear-gradient(135deg, #ffffff, #eff6ff, #ecfeff);
      }

      input[type="file"]::file-selector-button {
        border: none;

        padding: 9px 14px;

        margin-right: 8px;

        border-radius: 8px;

        color: white;

        font-weight: bold;

        cursor: pointer;

        background: linear-gradient(135deg, #2563eb, #06b6d4, #10b981);

        box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);

        transition: 0.25s ease;
      }

      input[type="file"]::file-selector-button:hover {
        transform: translateY(-1px);

        box-shadow: 0 7px 15px rgba(37, 99, 235, 0.28);
      }

      /* =====================================================
       SUBMIT BUTTON
    ===================================================== */

      button {
        position: relative;

        width: 100%;

        padding: 14px;

        border: none;

        border-radius: 11px;

        color: white;

        font-size: 17px;

        font-weight: bold;

        cursor: pointer;

        overflow: hidden;

        background: linear-gradient(135deg, #1d4ed8, #2563eb, #0891b2, #059669);

        background-size: 250% 250%;

        box-shadow: 0 12px 25px rgba(37, 99, 235, 0.25);

        animation: buttonGradient 6s ease infinite;

        transition:
          transform 0.2s ease,
          box-shadow 0.25s ease;
      }

      @keyframes buttonGradient {
        0% {
          background-position: 0% 50%;
        }

        50% {
          background-position: 100% 50%;
        }

        100% {
          background-position: 0% 50%;
        }
      }

      button:hover {
        transform: translateY(-2px);

        box-shadow: 0 16px 30px rgba(37, 99, 235, 0.3);
      }

      button:active {
        transform: translateY(0);
      }

      button:disabled {
        background: #94a3b8;

        cursor: not-allowed;

        animation: none;

        transform: none;

        box-shadow: none;
      }

      /* =====================================================
       LOADING
    ===================================================== */

      .loading {
        display: none;

        margin-top: 12px;

        text-align: center;

        color: #475569;

        font-family: "Nikosh", sans-serif;
      }

      .loading::after {
        content: "";

        display: block;

        width: 45px;
        height: 4px;

        margin: 8px auto 0;

        border-radius: 10px;

        background: linear-gradient(90deg, #2563eb, #06b6d4, #10b981);

        animation: loading 1s linear infinite;
      }

      @keyframes loading {
        0% {
          opacity: 0.3;

          transform: scaleX(0.5);
        }

        50% {
          opacity: 1;

          transform: scaleX(1);
        }

        100% {
          opacity: 0.3;

          transform: scaleX(0.5);
        }
      }

      /* =====================================================
       FOOTER
    ===================================================== */

      .footer {
        padding: 0 20px 20px;

        text-align: center;

        color: #dadfe6;

        font-size: 11px;
      }

      /* =====================================================
       MOBILE
    ===================================================== */

      @media (max-width: 650px) {
        body {
          padding: 12px 8px;
        }

        .container {
          border-radius: 20px;
        }

        .header {
          padding: 25px 15px;
        }

        .logo-wrap {
          width: 78px;
          height: 78px;
        }

        .header h1 {
          font-size: 18px;
        }

        .form-area {
          padding: 20px 15px;
        }

        .form-grid {
          grid-template-columns: 1fr;
        }

        .full-width {
          grid-column: auto;
        }

        .search-box {
          font-size: 13px;

          padding: 14px 10px;
        }
      }

      @media (max-width: 380px) {
        .header h1 {
          font-size: 17px;
        }

        .form-area {
          padding: 17px 12px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- =================================================
         HEADER
    ================================================== -->

      <div class="header">
        <div class="logo-wrap">
          <img src="batch2020logo.png" alt="2020 Batch Logo" />
        </div>

        <h1>
          বান্দরবান পার্বত্য জেলায় ২০২০ ব্যাচের কল্যাণ ফান্ডে ব্যাচমেটের
          সাহায্যের জন্য প্রেরিত টাকার তথ্য এন্ট্রি করুন….
        </h1>

        <div class="header-subtitle">2020 BATCH • WELFARE FUND</div>
      </div>

      <!-- =================================================
         SEARCH
    ================================================== -->

      <div class="search-box">
        আপনার জমাকৃত টাকার তথ্য অনুসন্ধান করতে

        <a href="serch.html"> HERE </a>

        ক্লিক করুন
      </div>

      <!-- =================================================
         FORM
    ================================================== -->

      <div class="form-area">
        <div id="message" class="message"></div>

        <form id="dataForm">
          <!-- Hidden ID -->

          <input type="hidden" id="ID" name="ID" />

          <div class="form-grid">
            <!-- =============================================
               BP
          ============================================== -->

            <div class="form-group">
              <label> BP <span>*</span> </label>

              <input
                type="text"
                id="BP"
                name="BP"
                placeholder="BP1234567890"
                maxlength="12"
                autocomplete="off"
                required
              />
            </div>

            <!-- =============================================
               RANK
          ============================================== -->

            <div class="form-group">
              <label> Rank <span>*</span> </label>

              <select id="Rank" name="Rank" required>
                <option value="">-- নির্বাচন করুন --</option>

                <option value="কনস্টেবল">কনস্টেবল</option>

                <option value="নায়েক">নায়েক</option>

                <option value="এএসআই (নিরস্ত্র)">এএসআই (নিরস্ত্র)</option>
              </select>
            </div>

            <!-- =============================================
               BRUSH
          ============================================== -->

            <div class="form-group">
              <label> Brush <span>*</span> </label>

              <input type="text" id="Brush" name="Brush" required />
            </div>

            <!-- =============================================
               NAME
          ============================================== -->

            <div class="form-group">
              <label> Name <span>*</span> </label>

              <input type="text" id="Name" name="Name" required />
            </div>

            <!-- =============================================
               UNIT
          ============================================== -->

            <div class="form-group">
              <label> Unit <span>*</span> </label>

              <select id="Unit" name="Unit" required>
                <option value="">-- নির্বাচন করুন --</option>

                <option value="সদর থানা">সদর থানা</option>
                <option value="রুমা থানা">রুমা থানা</option>
                <option value="রোয়াংছড়ি থানা">রোয়াংছড়ি থানা</option>
                <option value="নাইক্ষংছড়ি থানা">নাইক্ষংছড়ি থানা</option>
                <option value="আলীকদম থানা">আলীকদম থানা</option>
                <option value="থানচি থানা">থানচি থানা</option>
                <option value="লামা থানা">লামা থানা</option>

                <option value="ঘুমধুম তদন্ত কেন্দ্র">
                  ঘুমধুম তদন্ত কেন্দ্র
                </option>

                <option value="বাইশারী তদন্ত কেন্দ্র">
                  বাইশারী তদন্ত কেন্দ্র
                </option>

                <option value="টংকাবতি তদন্ত কেন্দ্র">
                  টংকাবতি তদন্ত কেন্দ্র
                </option>

                <option value="সদর ফাঁড়ি">সদর ফাঁড়ি</option>
                <option value="বাইশারী ফাঁড়ি">বাইশারী ফাঁড়ি</option>
                <option value="কেয়াজুপাড়া ফাঁড়ি">কেয়াজুপাড়া ফাঁড়ি</option>
                <option value="গজালিয়া ফাঁড়ি">গজালিয়া ফাঁড়ি</option>
                <option value="সোনাইছড়ি ফাঁড়ি">সোনাইছড়ি ফাঁড়ি</option>
                <option value="ফাইতং ফাঁড়ি">ফাইতং ফাঁড়ি</option>
                <option value="রাজবিল্লা ফাঁড়ি">রাজবিল্লা ফাঁড়ি</option>

                <option value="ডিবি">ডিবি</option>
                <option value="ডিএসবি">ডিএসবি</option>

                <option value="সদর কোর্ট">সদর কোর্ট</option>
                <option value="লামা কোর্ট">লামা কোর্ট</option>

                <option value="সদর ট্রাফিক">সদর ট্রাফিক</option>

                <option value="লামা ট্রাফিক">লামা ট্রাফিক</option>

                <option value="আলীকদম ট্রাফিক">আলীকদম ট্রাফিক</option>

                <option value="নাইক্ষ্যংছড়ি ট্রাফিক">
                  নাইক্ষ্যংছড়ি ট্রাফিক
                </option>

                <option value="পুলিশ সুপারের কার্যালয়">
                  পুলিশ সুপারের কার্যালয়
                </option>

                <option value="এমটি">এমটি</option>

                <option value="পুলিশ কন্ট্রোল রুম">পুলিশ কন্ট্রোল রুম</option>

                <option value="ডিপার্টমেন্টাল স্টোর">
                  ডিপার্টমেন্টাল স্টোর
                </option>

                <option value="অস্ত্রাগার">অস্ত্রাগার</option>

    <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

    <script>
      // =====================================================
      // Apps Script Web App URL
      // =====================================================

      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbxvtm-QWsOwbFlBorJbd0bLbiW72yS2DxpDM4eOUmDtPHBEd5EnbHqnnExq8f5-M0xhvA/exec";

      // =====================================================
      // Elements
      // =====================================================

      const form = document.getElementById("dataForm");

      const bpInput = document.getElementById("BP");

      const jonnoInput = document.getElementById("Jonno");

      const idInput = document.getElementById("ID");

      const message = document.getElementById("message");

      const submitBtn = document.getElementById("submitBtn");

      const loading = document.getElementById("loading");

      // =====================================================
      // BP Auto Uppercase
      // =====================================================

      bpInput.addEventListener("input", function () {
        this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
      });

      // =====================================================
      // ID তৈরি
      // BP + Jonno
      // =====================================================

      function generateID() {
        const bp = bpInput.value.trim().toUpperCase();

        const jonno = jonnoInput.value.trim();

        if (/^BP\d{10}$/.test(bp) && jonno !== "") {
          idInput.value = bp + jonno;
        } else {
          idInput.value = "";
        }
      }

      bpInput.addEventListener("input", generateID);

      jonnoInput.addEventListener("change", generateID);

      // =====================================================
      // Message
      // =====================================================

      function showMessage(text, type) {
        message.textContent = text;

        message.className = "message " + type;

        window.scrollTo({
          top: 0,
          behavior: "smooth",
        });
      }

      function clearMessage() {
        message.textContent = "";

        message.className = "message";
      }

      // =====================================================
      // Photo → Base64
      // =====================================================

      function fileToBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();

          reader.onload = () => resolve(reader.result);

          reader.onerror = () => reject(reader.error);

          reader.readAsDataURL(file);
        });
      }

      // =====================================================
      // FORM SUBMIT
      // =====================================================

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        clearMessage();

        generateID();

        // =================================================
        // BP validation
        // =================================================

        const bp = bpInput.value.trim().toUpperCase();

        if (!/^BP\d{10}$/.test(bp)) {
          showMessage(
            "BP অবশ্যই BP দিয়ে শুরু হয়ে মোট ১২টি character হতে হবে। উদাহরণ: BP1234567890",
            "error",
          );

          bpInput.focus();

          return;
        }

        // =================================================
        // Photo
        // =================================================

        const photo = document.getElementById("Photo").files[0];

        if (!photo) {
          showMessage("Photo নির্বাচন করুন।", "error");

          return;
        }

        // =================================================
        // JPG / JPEG validation
        // =================================================

        const fileName = photo.name.toLowerCase();

        if (!fileName.endsWith(".jpg") && !fileName.endsWith(".jpeg")) {
          showMessage("Photo শুধুমাত্র JPG অথবা JPEG হতে হবে।", "error");

          return;
        }

        // =================================================
        // MIME validation
        // =================================================

        if (photo.type && photo.type !== "image/jpeg") {
          showMessage("শুধুমাত্র JPEG/JPG image গ্রহণ করা হবে।", "error");

          return;
        }

        // =================================================
        // File size
        // =================================================

        const maxSize = 5 * 1024 * 1024;

        if (photo.size > maxSize) {
          showMessage("Photo-এর size সর্বোচ্চ 5 MB হতে পারবে।", "error");

          return;
        }

        // =================================================
        // SEND
        // =================================================

        try {
          submitBtn.disabled = true;

          loading.style.display = "block";

          // ===============================================
          // Convert photo to Base64
          // ===============================================

          const photoData = await fileToBase64(photo);

          // ===============================================
          // Form Data
          // ===============================================

          const formData = new URLSearchParams();

          formData.append("BP", bp);

          formData.append("Rank", document.getElementById("Rank").value);

          formData.append(
            "Brush",
            document.getElementById("Brush").value.trim(),
          );

          formData.append("Name", document.getElementById("Name").value.trim());

          formData.append("Unit", document.getElementById("Unit").value);

          formData.append("Date", document.getElementById("Date").value);

          formData.append("Jonno", document.getElementById("Jonno").value);

          formData.append("Amount", document.getElementById("Amount").value);

          formData.append("Method", document.getElementById("Method").value);

          formData.append(
            "Mobile",
            document.getElementById("Mobile").value.trim(),
          );

          formData.append(
            "Remark",
            document.getElementById("Remark").value.trim(),
          );

          // ===============================================
          // Hidden ID
          // ===============================================

          formData.append("ID", idInput.value);

          // ===============================================
          // Photo
          // ===============================================

          formData.append("PhotoName", photo.name);

          formData.append("PhotoData", photoData);

          // ===============================================
          // Send to Apps Script
          // ===============================================

          const response = await fetch(SCRIPT_URL, {
            method: "POST",
            body: formData,
          });

          const result = await response.json();

          // ===============================================
          // SUCCESS
          // ===============================================

          if (result.success) {
            showMessage(
              "তথ্য সফলভাবে সংরক্ষণ হয়েছে। ID: " + result.id,
              "success",
            );

            form.reset();

            idInput.value = "";
          }

          // ===============================================
          // SERVER ERROR
          // ===============================================
          else {
            showMessage(result.message || "তথ্য সংরক্ষণ করা যায়নি।", "error");
          }
        } catch (error) {
          // ===============================================
          // NETWORK ERROR
          // ===============================================

          console.error(error);

          showMessage(
            "Server-এর সাথে যোগাযোগ করা যাচ্ছে না। আবার চেষ্টা করুন।",
            "error",
          );
        } finally {
          // ===============================================
          // FINALLY
          // ===============================================

          submitBtn.disabled = false;

          loading.style.display = "none";
        }
      });
    </script>
  </body>
